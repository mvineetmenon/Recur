# Recur Agent Example Configuration
# Copy to /etc/recur/config.yaml and adjust targets for your environment.
#
# Task types: http, https, tcp, ping, command, script
# Nested systems go under `dependencies` (recursively).

system:
  name: "Local Services"
  description: "Example agent configuration (edit targets)"
  interval: 60  # Check every 60 seconds

  tasks:
    - name: "server_health"
      type: http
      url: "http://localhost:8000/api/v1/health"
      expected_status: 200
      timeout: 5

    - name: "disk_ok"
      type: command
      command: 'df -P / | awk "NR==2 {exit ($5+0 >= 90)}"'
      timeout: 10

    - name: "port_8000"
      type: tcp
      host: "localhost"
      port: 8000
      timeout: 5

    - name: "ping_gateway"
      type: ping
      host: "127.0.0.1"
      timeout: 5

    # Script checks: exit code 0 = UP
    # - name: "custom_check"
    #   type: script
    #   path: "/opt/recur/checks/mycheck.sh"
    #   timeout: 30

  dependencies:
    - name: "Database"
      id: "db"
      description: "Nested example dependency (remove if unused)"
      criticality: HIGH
      tasks:
        - name: "db_port"
          type: tcp
          host: "localhost"
          port: 5432
          timeout: 5

services:
  # Central Server (default profile: server + PostgreSQL)
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    # All variables come from `.env` (see .env.example); the values below are
    # the defaults applied when a variable is absent. The container always
    # listens on 0.0.0.0:8000; map the host port with RECUR_HTTP_PORT.
    # Note: compose does not support nested ${VAR:-...} defaults, so the DB
    # URL is built from DB_PASSWORD directly (see .env.example).
    ports:
      - "${RECUR_HTTP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://recur:${DB_PASSWORD:-recur-dev-password}@postgres:5432/recur
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Explicit bind for the container (the standalone default is loopback).
      - HOST=0.0.0.0
      - PORT=8000
      # Empty default: CORS disabled unless .env sets CORS_ORIGINS.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Empty default: open agent registration (dev). Set for real deployments.
      - RECUR_ENROLLMENT_TOKEN=${RECUR_ENROLLMENT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 -m server.app.main
    networks:
      - recur-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL (default database; JSON columns map to JSONB)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recur
      POSTGRES_USER: recur
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recur-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    networks:
      - recur-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recur -d recur"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (Optional, for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - recur-network
    profiles:
      - production

networks:
  recur-network:
    driver: bridge

volumes:
  postgres_data:

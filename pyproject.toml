[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recur"
version = "0.1.0"
description = "Recursive System Health Monitoring Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Recur Contributors"}
]
keywords = ["monitoring", "health-check", "recursive", "yaml", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "pyyaml==6.0.1",
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
    "jinja2==3.1.2",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "isort==5.13.2",
    "pre-commit==3.5.0",
]

db = [
    "psycopg2-binary==2.9.9",
]

[project.urls]
Homepage = "https://github.com/mvineetmenon/Recur"
Documentation = "https://github.com/mvineetmenon/Recur#readme"
Repository = "https://github.com/mvineetmenon/Recur.git"
Issues = "https://github.com/mvineetmenon/Recur/issues"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

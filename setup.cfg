[coverage:run]
source = server/app
omit =
    */tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,build,dist,.eggs
ignore = E203,W503
per-file-ignores =
    __init__.py:F401

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
